<!DOCTYPE html>
<html>
<head>
<title>Resources</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Noto Sans', sans-serif;
  margin: 0;
  background: #f5f3ee;
}

/* ── TOP BAR ─────────────────────────────────────────── */
#top-bar {
  position: relative;
  display: flex;
  justify-content: center;
  padding: 0 2.5rem;
  height: 420px;
  background-color: #1a1a18;
  background-image: linear-gradient(rgba(0,0,0,0.48), rgba(0,0,0,0.48)),
    url("https://windows10spotlight.com/wp-content/uploads/2020/09/fcc0572cf4a56cd33d5db03267c604d8.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  color: #f7f5f0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.18);
}

#top-bar div.nav {
  display: flex;
  position: absolute;
  top: 18%;
  gap: 3.5rem;
}

#top-bar div.nav a {
  color: white;
  text-decoration: none;
  font-size: 1.15rem;
  letter-spacing: 0.08em;
  transition: color 0.2s;
}
#top-bar div.nav a:hover { color: #e8dfc8; }

#top-bar .hero-title {
  position: absolute;
  top: 62%;
  font-size: 2.4rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.01em;
}

/* ── STICKY NAV ──────────────────────────────────────── */
#sticky-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  height: 54px;
  background: #255925;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.5rem;
  box-shadow: 0 2px 12px rgba(0,0,0,0.28);
  transform: translateY(-100%);
  transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}

#sticky-nav.visible {
  transform: translateY(0);
  pointer-events: all;
}

#sticky-nav .sticky-brand {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #ffffff;
  white-space: nowrap;
}

#sticky-nav .sticky-links {
  display: flex;
  gap: 2.5rem;
}

#sticky-nav .sticky-links a {
  color: #ffffff;
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 0.07em;
  transition: color 0.2s;
}
#sticky-nav .sticky-links a:hover { color: #e8dfc8; }

/* ── PAGE BODY ───────────────────────────────────────── */
#page-body {
  display: flex;
  align-items: flex-start;
  padding: 2.5rem 2.5rem 4rem;
  gap: 2rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── FILTER SIDEBAR ──────────────────────────────────── */
#filter-sidebar {
  flex: 0 0 230px;
  min-width: 200px;
  background: #fff;
  border: 1px solid #e0ddd5;
  border-radius: 4px;
  padding: 0 0 1rem;
  font-size: 0.82rem;
  position: sticky;
  top: 1.5rem;
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
}

.filter-section {
  border-bottom: 1px solid #e8e5dd;
}
.filter-section:last-child { border-bottom: none; }

.filter-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.65rem 1rem;
  cursor: pointer;
  user-select: none;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #3a3a38;
  background: #faf9f6;
}
.filter-section-header:hover { background: #f0ede5; }

.filter-section-header .chevron {
  font-size: 0.65rem;
  transition: transform 0.2s;
  color: #888;
}
.filter-section.collapsed .chevron { transform: rotate(-90deg); }

.filter-section-body {
  padding: 0.4rem 1rem 0.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.28rem;
}
.filter-section.collapsed .filter-section-body { display: none; }

.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
}

.filter-row label {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  cursor: pointer;
  color: #3a3a38;
  font-size: 0.8rem;
  flex: 1;
}

.filter-row input[type="checkbox"] {
  accent-color: #2d7a4f;
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  cursor: pointer;
}

.filter-count {
  color: #999;
  font-size: 0.72rem;
  min-width: 22px;
  text-align: right;
}

/* ── RESULTS AREA ────────────────────────────────────── */
#results-area {
  flex: 1;
}

#results-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.4rem;
}

#results-header h2 {
  font-size: 0.85rem;
  font-weight: 600;
  color: #555;
  margin: 0;
  letter-spacing: 0.03em;
}

#active-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.filter-tag {
  background: #e8f3ec;
  color: #2d7a4f;
  border: 1px solid #b8ddc8;
  border-radius: 20px;
  padding: 0.18rem 0.65rem;
  font-size: 0.72rem;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-weight: 500;
}
.filter-tag .remove {
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
  color: #2d7a4f;
}

/* ── IMAGE GRID ──────────────────────────────────────── */
#image-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.4rem;
}

.image-option {
  display: block;
  text-decoration: none;
  color: inherit;
}

.image-option-image-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 3px;
  background: #e8e5dd;
}

.image-option-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transition: transform 0.3s ease;
}
.image-option:hover .image-option-image { transform: scale(1.04); }

.image-option p {
  margin: 0.45rem 0 0;
  font-size: 0.88rem;
  font-weight: 500;
  color: #2a2a28;
}

.image-option.hidden { display: none; }

/* ── CLEAR FILTERS BTN ───────────────────────────────── */
#clear-all {
  background: none;
  border: none;
  color: #2d7a4f;
  font-size: 0.75rem;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
  display: none;
}

</style>
</head>
<body>

<nav id="sticky-nav">
  <span class="sticky-brand">Mill River Park</span>
  <div class="sticky-links">
   <a href="homepage.html">Home</a>
    <a href="pollinatorpage.html">Pollinators</a>
    <a href="birdpage.html">Birds</a>
    <a href="peoplepage.html">People</a>
<a href="resources.html">Resources</a>
  </div>
</nav>

<div id="top-bar">
  <div class="nav">
   <a href="homepage.html">Home</a>
    <a href="pollinatorpage.html">Pollinators</a>
    <a href="birdpage.html">Birds</a>
    <a href="peoplepage.html">People</a>
<a href="resources.html">Resources</a>
  </div>
  <p class="hero-title">Resources</p>
</div>

<div id="page-body">
<iframe width="560" height="315" src="https://www.youtube.com/embed/PnjaqQZZAJM?si=a9FDxqlemFCjrtgu" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

<iframe width="560" height="315" src="https://www.youtube.com/embed/gvlumx640Yg?si=wxRL5Oepol5gfDS1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<iframe width="560" height="315" src="https://www.youtube.com/embed/llhYO6NXDOo?si=P5OtkB6rX6FEtO8p" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
<iframe width="560" height="315" src="https://www.youtube.com/embed/aKwKbx3T8Xw?si=uSs9pIMT8Z-5rHco" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  </div>
<script>
  function toggleSection(id) {
    document.getElementById(id).classList.toggle('collapsed');
  }

  function getCheckedFilters() {
    const groups = {};
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
      const key = cb.dataset.filter;
      if (!groups[key]) groups[key] = [];
      groups[key].push(cb.dataset.value);
    });
    return groups;
  }

  function applyFilters() {
    const groups = getCheckedFilters();
    const cards = document.querySelectorAll('.image-option');
    let visible = 0;

    cards.forEach(card => {
      let match = true;
      for (const [key, values] of Object.entries(groups)) {
        const cardVals = (card.dataset[key] || '').split(',').map(s => s.trim());
        const hasAny = values.some(v => cardVals.includes(v));
        if (!hasAny) { match = false; break; }
      }
      card.classList.toggle('hidden', !match);
      if (match) visible++;
    });

    document.getElementById('results-count').textContent = `${visible} Plant${visible !== 1 ? 's' : ''}`;
    renderTags(groups);
    document.getElementById('clear-all').style.display = Object.keys(groups).length ? 'inline' : 'none';
  }

  function renderTags(groups) {
    const container = document.getElementById('active-filters');
    container.innerHTML = '';
    for (const [key, values] of Object.entries(groups)) {
      values.forEach(val => {
        const tag = document.createElement('span');
        tag.className = 'filter-tag';
        tag.innerHTML = `${val} <span class="remove" data-filter="${key}" data-value="${val}">×</span>`;
        container.appendChild(tag);
      });
    }

    container.querySelectorAll('.remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const cb = document.querySelector(
          `input[data-filter="${btn.dataset.filter}"][data-value="${btn.dataset.value}"]`
        );
        if (cb) { cb.checked = false; applyFilters(); }
      });
    });
  }

  function clearAllFilters() {
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => cb.checked = false);
    applyFilters();
  }

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', applyFilters);
  });

  const stickyNav = document.getElementById('sticky-nav');
  const topBar = document.getElementById('top-bar');
  const observer = new IntersectionObserver(
    ([entry]) => { stickyNav.classList.toggle('visible', !entry.isIntersecting); },
    { threshold: 0 }
  );
  observer.observe(topBar);
</script>

</body>
</html>
